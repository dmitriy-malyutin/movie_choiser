# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install Python and dependencies
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'  # или другая версия Python, которая вам нужна

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Flask Flask-Frozen  # Установите необходимые зависимости
          pip install flask

      # Generate static files using Flask-Frozen
      - name: Generate static site
        run: |
          python -m flask freeze  # Убедитесь, что ваш app.py настроен на использование Flask-Frozen

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build'  # Путь к сгенерированным статическим файлам

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
