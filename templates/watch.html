<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Смотреть серию</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='pics/7423721-648226759.png') }}">
</head>
<body>
    <div class="container">
        <h1>Смотреть серию</h1>
        <video id="videoPlayer" width="640" height="360" controls autoplay>
            <source src="{{ video_path }}" type="video/mp4">
            Ваш браузер не поддерживает тег видео.
        </video>
        <button id="nextButton" style="display: none;">Следующая серия</button>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const videoPlayer = document.getElementById('videoPlayer');
            const nextButton = document.getElementById('nextButton');

            videoPlayer.addEventListener('ended', function() {
                fetch('/get_next_video')
                    .then(response => response.json())
                    .then(data => {
                        if (data.video_path) {
                            videoPlayer.src = data.video_path;
                            videoPlayer.play();
                        } else {
                            nextButton.style.display = 'block';
                        }
                    });
            });

            nextButton.addEventListener('click', function() {
                fetch('/get_next_video')
                    .then(response => response.json())
                    .then(data => {
                        if (data.video_path) {
                            videoPlayer.src = data.video_path;
                            videoPlayer.play();
                            nextButton.style.display = 'none';
                        }
                    });
            });
        });
    </script>
</body>
</html>
